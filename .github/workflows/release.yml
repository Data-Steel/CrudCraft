name: Release to Maven Central

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release-ref.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Capture released commit
        id: release-ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase:  ${{ secrets.SIGNING_PASSWORD }}

      - name: Configure GPG for headless use
        run: |
          mkdir -p ~/.gnupg
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Export env for Central auth
        run: |
          echo "CENTRAL_USERNAME=${{ secrets.CENTRAL_USERNAME }}" >> $GITHUB_ENV
          echo "CENTRAL_PASSWORD=${{ secrets.CENTRAL_PASSWORD }}" >> $GITHUB_ENV

      - name: Write settings.xml (explicit)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          XML

      - name: Set version from tag (no -SNAPSHOT)
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Release preflight / verify Maven reactor
        run: >
          mvn -B -U -Dstyle.color=always
          -Dcrudcraft.tck.postgres.required=true
          -Dpit.skip=true
          -Djavadoc.fail.on.warnings=true
          verify

      - name: Release preflight / golden generated-source check
        run: >
          mvn -B -U -pl crudcraft-codegen -am -Dstyle.color=always
          -Dtest=GoldenTestRunner -Dsurefire.failIfNoSpecifiedTests=false test
          || (echo "Generator output changed. Run 'mvn test -pl crudcraft-codegen -Pgolden-update -Dtest=GoldenTestRunner' and review the diff in expected/." && exit 1)

      - name: Release preflight / license header check
        run: mvn -B -Dstyle.color=always license:check

      - name: Release preflight / Javadoc aggregate gate
        run: mvn -B -Dstyle.color=always -DskipTests -Djavadoc.fail.on.warnings=true javadoc:aggregate

      - name: Release preflight / quality reports
        shell: pwsh
        run: ./scripts/verify-quality-reports.ps1

      - name: Release preflight / OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -U -Dstyle.color=always
          org.owasp:dependency-check-maven:12.2.1:aggregate
          -DnvdApiKey="${NVD_API_KEY}"
          -Dformats=HTML,JSON
          -DfailBuildOnCVSS=7

      - name: Release preflight / validate docs index
        shell: pwsh
        run: ./scripts/update-doc-index.ps1

      - name: Build, sign & deploy
        run: |
          mvn -B -U -P release \
            -pl '!crudcraft-sample-app' -am \
            -Dgpg.passphrase="${{ secrets.SIGNING_PASSWORD }}" \
            -Dgpg.executable=gpg \
            -DskipTests=false \
            -Dstyle.color=always \
            deploy

      - name: Verify Maven Central publication
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          GROUP_PATH="nl/datasteel/crudcraft"
          ARTIFACTS=(
            crudcraft-api
            crudcraft-runtime-core
            crudcraft-runtime-search
            crudcraft-runtime-export
            crudcraft-runtime-extensions
            crudcraft-runtime-projection
            crudcraft-runtime-security
            crudcraft-runtime-observability
            crudcraft-codegen
            crudcraft-spring-boot-starter-core
            crudcraft-spring-boot-starter-security
            crudcraft-spring-boot-starter-search
            crudcraft-spring-boot-starter-export
            crudcraft-spring-boot-starter-projection
            crudcraft-spring-boot-starter-extensions
            crudcraft-spring-boot-starter-observability
            crudcraft-spring-boot-starter
            crudcraft-tools
          )
          for artifact in "${ARTIFACTS[@]}"; do
            base="https://repo1.maven.org/maven2/${GROUP_PATH}/${artifact}/${VERSION}/${artifact}-${VERSION}"
            for extension in pom jar; do
              url="${base}.${extension}"
              for attempt in {1..30}; do
                if curl --fail --silent --head "$url" > /dev/null; then
                  echo "Verified ${url}"
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  echo "::error::Missing Maven Central artifact: ${url}"
                  exit 1
                fi
                sleep 20
              done
            done
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign release artifacts with Sigstore
        env:
          COSIGN_YES: "true"
        run: |
          mkdir -p target/release-signatures
          find . \( -path './target/*' -o -path './*/target/*' \) \
            \( -name '*.jar' -o -name '*.pom' -o -name 'crudcraft-*-cyclonedx.json' -o -name 'crudcraft-*-cyclonedx.xml' \) \
            -type f -print0 \
            | while IFS= read -r -d '' file; do
                safe_name="$(echo "$file" | sed 's#^\./##; s#[/\\]#-#g')"
                cosign sign-blob --yes --bundle "target/release-signatures/${safe_name}.sigstore.bundle" "$file"
              done

      - name: Upload SBOM and Sigstore bundles to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            target/crudcraft-*-cyclonedx.json \
            target/crudcraft-*-cyclonedx.xml \
            target/release-signatures/*.sigstore.bundle \
            --clobber

  docs:
    name: Dispatch docs deploy
    needs: release
    uses: ./.github/workflows/dispatch-docs.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      release_url: ${{ github.event.release.html_url }}
      release_sha: ${{ needs.release.outputs.release_sha }}
    secrets: inherit

