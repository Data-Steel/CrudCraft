# Default profile is intentionally not a runnable demo profile.
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
crudcraft.api.max-page-size=100
crudcraft.search.depth=2
crudcraft.projection.engine=criteria
crudcraft.projection.registry-fqcn=nl.datasteel.crudcraft.sample.projection.GeneratedProjectionMetadataRegistry
crudcraft.security.jwt.secret=${CRUDCRAFT_JWT_SECRET}
